<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="gaadi.pk — Apni seat, apni gaadi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="1120" cy="540" r="160" fill="#ffffff" opacity="0.05"/>

  <!-- Logo badge (white badge, blue car, green road) -->
  <g transform="translate(96,92) scale(3.0)">
    <rect width="32" height="32" rx="8" fill="#ffffff"/>
    <path d="M7 18.5l1.4-4.2A2.5 2.5 0 0 1 10.8 12.5h10.4a2.5 2.5 0 0 1 2.4 1.8L25 18.5v3.2a1 1 0 0 1-1 1h-1.2a1 1 0 0 1-1-1V21H10.2v.7a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z" fill="#2563eb"/>
    <circle cx="10.5" cy="18.3" r="1.3" fill="#ffffff"/>
    <circle cx="21.5" cy="18.3" r="1.3" fill="#ffffff"/>
    <rect x="7" y="25.2" width="18" height="2.1" rx="1.05" fill="#22c55e"/>
  </g>

  <!-- Wordmark -->
  <text x="206" y="170" font-family="'DejaVu Sans', Arial, sans-serif" font-size="74" font-weight="bold" fill="#ffffff">gaadi<tspan fill="#4ade80">.pk</tspan></text>

  <!-- Tagline -->
  <text x="100" y="320" font-family="'DejaVu Sans', Arial, sans-serif" font-size="76" font-weight="bold" fill="#ffffff">Apni seat, apni gaadi</text>

  <!-- Sub copy -->
  <text x="100" y="392" font-family="'DejaVu Sans', Arial, sans-serif" font-size="38" fill="#dbeafe">Seats &amp; whole vehicles to Gilgit-Baltistan</text>

  <!-- Destination chips -->
  <g font-family="'DejaVu Sans', Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    <rect x="100" y="446" width="150" height="60" rx="30" fill="#ffffff" opacity="0.14"/>
    <text x="130" y="485">Hunza</text>
    <rect x="266" y="446" width="150" height="60" rx="30" fill="#ffffff" opacity="0.14"/>
    <text x="296" y="485">Gilgit</text>
    <rect x="432" y="446" width="160" height="60" rx="30" fill="#ffffff" opacity="0.14"/>
    <text x="462" y="485">Skardu</text>
    <rect x="608" y="446" width="162" height="60" rx="30" fill="#ffffff" opacity="0.14"/>
    <text x="638" y="485">Ghizer</text>
  </g>

  <!-- Green road across bottom -->
  <rect x="0" y="588" width="1200" height="42" fill="#15803d"/>
  <g fill="#ffffff" opacity="0.85">
    <rect x="60" y="606" width="80" height="6" rx="3"/>
    <rect x="220" y="606" width="80" height="6" rx="3"/>
    <rect x="380" y="606" width="80" height="6" rx="3"/>
    <rect x="540" y="606" width="80" height="6" rx="3"/>
    <rect x="700" y="606" width="80" height="6" rx="3"/>
    <rect x="860" y="606" width="80" height="6" rx="3"/>
    <rect x="1020" y="606" width="80" height="6" rx="3"/>
  </g>

  <!-- URL -->
  <text x="1100" y="180" text-anchor="end" font-family="'DejaVu Sans', Arial, sans-serif" font-size="30" font-weight="bold" fill="#bfdbfe">gaadi.pk</text>
</svg>
