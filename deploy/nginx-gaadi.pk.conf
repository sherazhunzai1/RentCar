# =============================================================================
# gaadi.pk — nginx site config (Linux VPS)
#
# Serves the static build (dist/) and the prerendered routes, falls back to the
# SPA, proxies the API, and routes ONLY social-media crawlers for /vehicles/:id
# to the per-trip OG renderer (server/og-server.mjs) so shared trip links unfurl
# with the specific route/date/price. Real users are never proxied.
#
# Install:
#   1. Build the frontend (with VITE_API_URL=/api) and deploy the repo, e.g. to
#      /var/www/gaadi.pk  (so /var/www/gaadi.pk/dist and /var/www/gaadi.pk/server exist).
#   2. Copy this file to /etc/nginx/sites-available/gaadi.pk and symlink into
#      sites-enabled, or drop it in /etc/nginx/conf.d/gaadi.pk.conf
#   3. Get TLS:  sudo certbot --nginx -d gaadi.pk -d www.gaadi.pk
#   4. Start the OG renderer (see deploy/og-renderer.service)
#   5. sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Flag social-media link crawlers by User-Agent. MUST live in the http{} context
# (this file is included from http{}, so it is fine here).
map $http_user_agent $gaadi_is_crawler {
    default                                 0;
    "~*facebookexternalhit"                 1;
    "~*Facebot"                             1;
    "~*Twitterbot"                          1;
    "~*WhatsApp"                            1;
    "~*LinkedInBot"                         1;
    "~*Slackbot"                            1;
    "~*TelegramBot"                         1;
    "~*Discordbot"                          1;
    "~*Pinterest"                           1;
    "~*redditbot"                           1;
    "~*Applebot"                            1;
    "~*vkShare"                             1;
    "~*SkypeUriPreview"                     1;
    "~*Embedly"                             1;
    "~*W3C_Validator"                       1;
}

# ---- HTTP → HTTPS -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gaadi.pk www.gaadi.pk;
    return 301 https://gaadi.pk$request_uri;
}

# ---- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gaadi.pk www.gaadi.pk;

    # TLS (certbot fills these in)
    ssl_certificate     /etc/letsencrypt/live/gaadi.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaadi.pk/privkey.pem;

    # Optional: send www → apex
    if ($host = www.gaadi.pk) { return 301 https://gaadi.pk$request_uri; }

    root /var/www/gaadi.pk/dist;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- Per-trip social cards -----------------------------------------------
    # Only crawlers (per the map above) are proxied to the OG renderer; everyone
    # else gets the SPA. `if` is used solely with `return` (safe), and an
    # internal error_page hands crawler requests to the proxy location.
    location ~ ^/vehicles/[^/]+$ {
        recursive_error_pages on;
        error_page 418 = @og_renderer;
        if ($gaadi_is_crawler) { return 418; }
        try_files $uri /index.html;
    }

    location @og_renderer {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # --- API → backend (so the browser can call same-origin /api) ------------
    # Build the frontend with VITE_API_URL=/api to use this. Adjust the port to
    # match your backend.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # --- Socket.IO (booking chat) → backend, with WebSocket upgrade ----------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # --- Hashed assets: cache hard -------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # og-image / icons / sitemap etc. get a moderate cache
    location ~* \.(png|svg|webmanifest|xml|txt|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Static files, prerendered routes, then SPA fallback -----------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
